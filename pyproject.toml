[project]
name = "stepik-report-creator"
version = "1.0.0"
description = "Собирает docx-отчет с решениями задач из курса Stepik: код, условия и подписи — за одну команду"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "coloredlogs>=15.0.1",
    "environs>=14.1.1",
    "pillow>=11.2.1",
    "pydantic>=2.11.3",
    "python-docx>=1.1.2",
    "requests>=2.32.3",
]

[dependency-groups]
dev = ["pytest>=8.3.5", "ipython>=9.1.0"]
